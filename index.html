    <script>
      // Auto-recover if a stale PWA service worker cache causes chunk load errors
      window.addEventListener('vite:preloadError', function () {
        var lastReload = sessionStorage.getItem('hs_preload_reload');
        var now = Date.now();
        if (!lastReload || now - Number(lastReload) > 8000) {
          sessionStorage.setItem('hs_preload_reload', String(now));
          if ('caches' in window) {
            caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (k) { return caches.delete(k); }));
            }).finally(function () {
              window.location.reload();
            });
          } else {
            window.location.reload();
          }
        }
      });
    </script>
